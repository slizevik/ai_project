[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ai-project"
version = "0.1.0"
description = "Homework project based on the Cookiecutter Data Science template"
authors = [{ name = "Student" }]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "typer==0.27.3",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pre-commit==4.2.0",
    "ruff==0.11.13",
]

[tool.ruff]
line-length = 99
src = ["ai_project"]

[tool.ruff.lint]
extend-select = ["B", "E501", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["ai_project"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["ai_project"]
exclude = [
    "(^|/)\\.git/",
    "(^|/)\\.venv/",
    "(^|/)__pycache__/",
    "(^|/)\\.mypy_cache/",
    "(^|/)\\.ruff_cache/",
]
